# Пример reverse proxy для диспетчера за существующим HTTPS-терминатором сайта.
# Подставить server_name и путь к сертификату. Диспетчер слушает только 127.0.0.1:8090.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl http2;
    server_name dispatcher.example.test;
    # ssl_certificate     /etc/letsencrypt/live/dispatcher.example.test/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dispatcher.example.test/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
