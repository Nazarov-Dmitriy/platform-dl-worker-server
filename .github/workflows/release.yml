name: Worker release bundle
on:
  workflow_dispatch:
  push:
    tags: ["worker-v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate installer
        run: |
          python3 -B -m unittest discover -s deploy/standalone/tests -v
          bash -n deploy/standalone/install.sh deploy/standalone/export.sh deploy/standalone/package.sh
      - name: Test and package Linux amd64
        run: bash deploy/standalone/package.sh "$RUNNER_TEMP/worker-release"
      - name: Test TLS, WSS, reinstall and migration
        run: sudo python3 -B deploy/standalone/tests/smoke.py "$RUNNER_TEMP"/worker-release/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: worker-server-linux-amd64
          path: ${{ runner.temp }}/worker-release/*.tgz
      - name: Attach to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "Ready Linux amd64 dispatcher bundle. See README.md inside the archive."
          fi
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/worker-release/*.tgz --clobber
