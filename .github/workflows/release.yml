name: Worker release bundle
on:
  workflow_dispatch:
  push:
    tags: ["worker-v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate installer
        run: |
          sudo python3 -B -m unittest discover -s deploy/package/tests -v
          bash -n worker deploy/package/package.sh
      - name: Select release version
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "WORKER_RELEASE_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - name: Test and package Linux amd64
        run: bash deploy/package/package.sh "$RUNNER_TEMP/worker-release"
      - name: Test TLS, WSS, reinstall and migration
        run: sudo python3 -B deploy/package/tests/smoke.py "$RUNNER_TEMP"/worker-release/*.tgz
      - name: Test failed image rollback
        run: sudo python3 -B deploy/package/tests/update_smoke.py "$RUNNER_TEMP"/worker-release/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: worker-server-linux-amd64
          path: ${{ runner.temp }}/worker-release/*
      - name: Attach to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "Ready Linux amd64 dispatcher bundle. See README.md inside the archive."
          fi
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/worker-release/*.tgz "$RUNNER_TEMP"/worker-release/worker-update.json --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
